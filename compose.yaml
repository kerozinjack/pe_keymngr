services:
  pekeymngr:
    image: pekeymngr
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - database:/app/Data
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  database:
